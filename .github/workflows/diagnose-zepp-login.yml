name: Zepp login diagnostic (no step submission)

on:
  workflow_dispatch:
    inputs:
      perform_login:
        description: Make one Zepp authentication request only (no step upload)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check input format and optionally authenticate once
        env:
          USER: ${{ secrets.USER }}
          PWD: ${{ secrets.PWD }}
          PERFORM_LOGIN: ${{ inputs.perform_login }}
        run: |
          pip install -r requirements.txt
          python -m ops.diagnose_auth
