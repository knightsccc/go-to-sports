name: 刷步数

on:
  schedule:
    - cron: '15 14 * * *' # UTC; 22:15 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-steps
  cancel-in-progress: false

jobs:
  build:
    # Require explicit approval before ANY run can submit artificial steps.
    if: vars.RUN_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_AES_KEY: ${{ secrets.AES_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Restore encrypted login cache
        if: env.HAS_AES_KEY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: encrypted_tokens.data
          key: zepp-token-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zepp-token-cache-
      - name: Submit configured steps
        env:
          CONFIG: '{"MIN_STEP":"8000","MAX_STEP":"8000"}'
          USER: ${{ secrets.USER }}
          PWD: ${{ secrets.PWD }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip install -r requirements.txt
          python main.py
      - name: Save encrypted login cache
        if: success() && env.HAS_AES_KEY == 'true'
        uses: actions/cache/save@v4
        with:
          path: encrypted_tokens.data
          key: zepp-token-cache-${{ github.run_id }}-${{ github.run_attempt }}
